# LearnBiu 教程站点 nginx 配置（通配托管）
# 所有教程产物聚合在 deveops/sites/ 下，由 docker-compose 外挂到 /usr/share/nginx/html
# 新增教程无需改此配置：build.sh 把 dist 放到 sites/learnbiu_<slug>/ 即自动生效
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;
  client_max_body_size 100m;

  server {
    listen 80;
    server_name _;

    # 根路径：build.sh 生成的导航页 sites/index.html
    location = / {
      root /usr/share/nginx/html;
      try_files /index.html =404;
    }

    # 任意 /learnbiu_<slug>/ 子路径自动托管 + SPA fallback
    # 正则捕获 slug，root 映射文件路径；fallback 回退到该教程的 index.html
    location ~ ^/learnbiu_(?<slug>[a-z0-9_]+)/ {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /learnbiu_$slug/index.html;
    }

    # 其他路径 404
    location / { return 404; }
  }
}
