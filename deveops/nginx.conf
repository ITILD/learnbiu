# LearnBiu 教程站点 nginx 配置
# 各教程 dist 由 docker-compose 外挂到 /usr/share/nginx/html/<子路径>/
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;
  client_max_body_size 100m;

  server {
    listen 80;
    server_name _;

    # 根路径：返回教程导航页（内联 HTML，无需额外文件）
    location = / {
      default_type text/html;
      return 200 '<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>LearnBiu 教程</title><body style="font:16px system-ui;max-width:640px;margin:2rem auto;padding:0 1rem"><h1>LearnBiu 教程</h1><ul style="line-height:2"><li><a href=/learnbiu_rag/>RAG 检索增强生成</a><li><a href=/learnbiu_python/>Python 快速入门</a><li><a href=/learnbiu_cpp/>C++ 基础</a><li><a href=/learnbiu_ubuntu/>Ubuntu 运维</a><li><a href=/learnbiu_wsl2/>WSL2 入门</a></ul>';
    }

    # 各教程子路径：静态资源 + SPA fallback（刷新子路由回退到 index.html）
    # root 指令下，/learnbiu_xxx/foo 映射到 /usr/share/nginx/html/learnbiu_xxx/foo
    location /learnbiu_rag/    { root /usr/share/nginx/html; try_files $uri $uri/ /learnbiu_rag/index.html; }
    location /learnbiu_python/ { root /usr/share/nginx/html; try_files $uri $uri/ /learnbiu_python/index.html; }
    location /learnbiu_cpp/    { root /usr/share/nginx/html; try_files $uri $uri/ /learnbiu_cpp/index.html; }
    location /learnbiu_ubuntu/ { root /usr/share/nginx/html; try_files $uri $uri/ /learnbiu_ubuntu/index.html; }
    location /learnbiu_wsl2/   { root /usr/share/nginx/html; try_files $uri $uri/ /learnbiu_wsl2/index.html; }

    # 其他路径返回 404
    location / { return 404; }
  }
}
