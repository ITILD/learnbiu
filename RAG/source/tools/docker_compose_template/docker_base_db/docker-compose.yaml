name: "docker_milvus_20260707"
services:
  # milvus
  etcd:
    container_name: ${PROJECT_NAME:-1000}-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
  
  rustfs:
    container_name: ${PROJECT_NAME:-1000}-milvus-rustfs
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_REGION: us-east-1
    # RUSTFS_SERVER_DOMAINS: localhost# Optional; not required for local deployments
    ports:
      - "19001:9001"
      - "29000:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/rustfs:/data
    command: ["--address", ":9000", "--console-enable", "/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 20s
      retries: 3
      
  # # cpu version
  # standalone:
  #   container_name: milvus-standalone
  #   image: milvusdb/milvus:v3.0-beta
  #   command: ["milvus", "run", "standalone"]
  #   security_opt:
  #   - seccomp:unconfined
  #   environment:
  #     MINIO_REGION: us-east-1
  #     ETCD_ENDPOINTS: etcd:2379
  #     MINIO_ADDRESS: rustfs:9000
  #     MINIO_ACCESS_KEY: minioadmin
  #     MINIO_SECRET_KEY: minioadmin
  #     MINIO_USE_SSL: "false"
  #     MQ_TYPE: woodpecker
  #   volumes:
  #   - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
  #     interval: 30s
  #     start_period: 90s
  #     timeout: 20s
  #     retries: 3
  #   ports:
  #     - "29530:19530"
  #     - "9091:9091"
  #   depends_on:
  #     - "etcd"
  #     - "rustfs"   
  standalone:
    container_name: ${PROJECT_NAME:-1000}-milvus-standalone
    image: milvusdb/milvus:v2.6.15-gpu
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: rustfs:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_USE_SSL: "false"
      MQ_TYPE: woodpecker
    volumes:
    - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "29530:19530"
      - "19091:9091"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: ["gpu"]
              device_ids: ["0"]
    depends_on:
      - "etcd"
      - "rustfs"
  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.6
    environment:
      - MILVUS_URL=${PROJECT_NAME:-1000}-milvus-standalone:19530
    ports:
      - "28000:3000"
    restart: unless-stopped
    depends_on:
      - "standalone"
  nginx:
    # 容器名称 -80默认值
    container_name: ${PROJECT_NAME:-80}-nginx
    image: nginx:alpine
    ports:
    # 容器外端口/里
      - "80:80"
    volumes:
      - ./nginx/html:/usr/share/nginx/html
      - ./nginx/conf/:/etc/nginx/
      - ./nginx/download:/usr/share/nginx/download
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai  # 设置时区
    # 指向宿主机
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux需要这行
      
  postgis:
    container_name: ${PROJECT_NAME:-15432}-postgis
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-server_example}
      POSTGRES_USER: ${POSTGRES_USER:-hrzn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qwer1234}
      TZ: Asia/Shanghai
    volumes:
      # 将 PostgreSQL 数据目录挂载到宿主机 ./postgresql/data
      - ./postgresql/data:/var/lib/postgresql/data
      # 可选：初始化脚本目录
      - ./postgresql/init:/docker-entrypoint-initdb.d
    ports:
      - "15432:5432"
      
  redis:
    image: redis:8
    container_name: ${PROJECT_NAME:-16379}-redis
    command: redis-server --requirepass "qwer1234"
    ports:
      - "16379:6379"
    volumes:
      - .redis/data:/data          # 持久化数据
      - .redis/redis.conf:/usr/local/etc/redis/redis.conf  # 自定义配置（可选）
    restart: unless-stopped
  
# docker network create share_network 预先声明
networks:
  share_network:
    external: true

#| 服务        | 外部端口（Host） | 容器内端口（Container） | 用途说明 |
#|-------------|------------------|--------------------------|--------|
#| `nginx`     | `80`             | `80`                     | HTTP 服务 |
#| `postgis`   | `15432`          | `5432`                   | PostgreSQL/PostGIS 数据库 |
#| `redis`     | `16379`          | `6379`                   | Redis 服务（带密码） |
#| `milvus-standalone` | `19530`          | `19530`                   | Milvus 服务（GPU） |
#| `milvus-attu`     | `28000`          | `3000`                   | Milvus ATTU 服务Web UI |
#| `milvus-rustfs`     | `19001`          | `9001`                   | RustFS 主服务（如 S3 兼容 API） |
#| `milvus-rustfs`     | `19000`          | `9000`                   | RustFS 管理控制台（Console） |
#| `milvus-standalone`     | `29530`          | `19530`                   | Milvus 服务（GPU） |