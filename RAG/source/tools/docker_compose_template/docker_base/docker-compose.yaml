volumes:
  portainer_data:
    name: portainer_data

networks:
  portainer_network:
    name: portainer_network
### ✅ 已使用的外部端口（Host Ports）

#| 服务        | 外部端口（Host） | 容器内端口（Container） | 用途说明 |
#|-------------|------------------|--------------------------|--------|
#| `portainer` | `19000`          | `9000`                   | Portainer Web UI |
#| `portainer` | `18000`          | `8000`                   | Portainer Edge Agent（可选） |
#| `nginx`     | `80`             | `80`                     | HTTP 服务 |
#| `postgis`   | `15432`          | `5432`                   | PostgreSQL/PostGIS 数据库 |
#| `rustfs`    | `12000`          | `2000`                   | RustFS 主服务（如 S3 兼容 API） |
#| `rustfs`    | `12001`          | `2001`                   | RustFS 管理控制台（Console） |
#| `redis`     | `16379`          | `6379`                   | Redis 服务（带密码） |

# 注意rustfs给外挂目录权限