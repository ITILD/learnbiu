[project]
name = "source"
version = "0.1.0"
description = "大模型全流程教程：最小基模预训练 → SFT → DPO → INT8 量化（纯 PyTorch 从零实现）"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.11.0",
    # 数据集下载（TinyStories / Alpaca / DPO 对）
    "datasets>=3.0.0",
]


[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
# 1. 配置清华源为“默认”源 (default = true)
[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
